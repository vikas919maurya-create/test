<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkGo — Create Command Center Account</title>
    <meta name="description" content="Vnish Global & MonkGo — Register your mining farm command center account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           VNISH GLOBAL & MONKGO — Golden & Obsidian Theme
           ============================================ */
        :root {
            --gold-400: #FFD700;
            --gold-500: #F5C518;
            --gold-600: #C9A84C;
            --bg-primary: #0A0A0A;
            --bg-card: rgba(20, 20, 20, 0.8);
            --text-primary: #F5F5F5;
            --text-secondary: #A0A0A0;
            --text-muted: #666666;
            --border-color: rgba(255, 215, 0, 0.12);
            --border2: rgba(255, 215, 0, 0.25);
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #F5C518 40%, #C9A84C 100%);
            --gold-gradient-text: linear-gradient(135deg, #FFD700 0%, #FFED8A 30%, #FFD700 60%, #C9A84C 100%);
            --green: #10b981;
            --red: #ef4444;
            --font-primary: 'Outfit', sans-serif;
            --font-secondary: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-glow {
            position: fixed; inset: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 20%, rgba(255, 215, 0, 0.07) 0%, transparent 60%);
            z-index: 0;
        }

        .signup-card {
            position: relative; z-index: 1;
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.95), rgba(10, 10, 10, 0.98));
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border2);
            border-radius: var(--radius-lg);
            padding: 44px 38px;
            width: 100%; max-width: 440px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 50px rgba(255,215,0,0.1);
        }

        .signup-logo { text-align: center; margin-bottom: 28px; }
        .signup-logo h1 {
            font-family: var(--font-primary); font-size: 26px; font-weight: 900; letter-spacing: 3px;
            background: var(--gold-gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
        }
        .signup-logo span {
            font-size: 11px; color: var(--text-muted); letter-spacing: 2px;
            display: block; margin-top: 6px; font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label {
            display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary);
            letter-spacing: 1.2px; margin-bottom: 8px; text-transform: uppercase;
            font-family: var(--font-primary);
        }
        .form-group input {
            width: 100%; padding: 13px 16px;
            background: rgba(255, 255, 255, 0.03); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            font-size: 14px; font-family: var(--font-secondary);
            transition: all 0.2s; outline: none;
        }
        .form-group input:focus {
            border-color: var(--gold-400);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.12), 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .form-group input::placeholder { color: var(--text-muted); }

        .signup-btn {
            width: 100%; padding: 14px; margin-top: 8px;
            background: var(--gold-gradient); color: #0A0A0A;
            border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 700; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s;
            font-family: var(--font-primary);
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.25);
        }
        .signup-btn:hover {
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.4);
            transform: translateY(-1px);
        }
        .signup-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .msg-box {
            margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-sm);
            font-size: 12px; display: none; text-align: center;
        }
        .msg-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
        .msg-success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: var(--green); }

        .footer-link { text-align: center; margin-top: 22px; font-size: 12px; color: var(--text-muted); }
        .footer-link a { color: var(--gold-400); text-decoration: none; font-weight: 600; }
        .footer-link a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .signup-card { padding: 30px 20px; }
            .signup-logo h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="signup-card">
        <div class="signup-logo">
            <h1>MONKGO</h1>
            <span>CREATE CORE ACCOUNT</span>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="e.g. John Miner" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="off">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Minimum 6 characters" autocomplete="off">
        </div>

        <button class="signup-btn" id="signupBtn" onclick="handleSignup()">
            ⚡ CREATE ACCOUNT & GET SECRET KEY
        </button>

        <div class="msg-box msg-error" id="errorBox"></div>
        <div class="msg-box msg-success" id="successBox"></div>

        <div class="footer-link">
            Already have an account? <a href="index.html">Log In</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL  = "https://qsujmqgaxrtqnrbawfup.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdWptcWdheHJ0cW5yYmF3ZnVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NjEzNjMsImV4cCI6MjEwMjEzNzM2M30.KQvaaL_-bZgwUW4pUxqCsQC0ZhGWnWnLDfvHDYDVwB8";

        async function handleSignup() {
            const name     = document.getElementById('signupName').value.trim();
            const email    = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const btn      = document.getElementById('signupBtn');
            const errBox   = document.getElementById('errorBox');
            const succBox  = document.getElementById('successBox');

            errBox.style.display = 'none';
            succBox.style.display = 'none';

            if (!email || !password) {
                errBox.textContent = "⚠️ Please provide an email address and password.";
                errBox.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errBox.textContent = "⚠️ Password must be at least 6 characters long.";
                errBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = "PROVISIONING ACCOUNT...";

            try {
                const resp = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
                    method: 'POST',
                    headers: { "apikey": SUPABASE_ANON, "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, data: { full_name: name } })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.msg || data.error_description || "Signup failed.");

                succBox.innerHTML = `✓ <strong>Account created successfully!</strong><br><br>Redirecting to command center login...`;
                succBox.style.display = 'block';

                setTimeout(() => { window.location.href = "index.html"; }, 2000);
            } catch (err) {
                errBox.textContent = "⚠️ " + (err.message || "An error occurred during registration.");
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = "⚡ CREATE ACCOUNT & GET SECRET KEY";
            }
        }
    </script>
</body>
</html>
